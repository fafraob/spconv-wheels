[workspace]
name = "spconv-cu128-wheels"
description = "Build native CUDA 12.8 spconv/cumm wheels (incl. Blackwell sm_120)"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Toolchain comes entirely from conda-forge — no system CUDA, no root, no GPU.
# gcc/gxx are pinned to 12: the wheels bundle no libstdc++, so the newest
# GLIBCXX symbol they reference must exist on target systems. gcc 12 needs
# GLIBCXX <= 3.4.30 (Ubuntu 22.04's baseline); gcc 13/14 emit 3.4.31/32
# references and the wheels fail to import on 22.04. build.sh enforces this
# with a readelf gate on every built wheel.
[dependencies]
cuda-toolkit = "12.8.*"
gcc = "12.*"
gxx = "12.*"
cmake = "*"
ninja = "*"
git = "*"
pip = "*"

# Build-time python deps, pinned to the versions the wheels were verified with.
[pypi-dependencies]
pccm = "==0.4.16"
ccimport = "==0.4.4"
setuptools = "*"
wheel = "*"
numpy = "*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
py310 = ["py310"]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
