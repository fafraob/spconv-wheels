[workspace]
name = "spconv-wheels"
description = "Build native CUDA 12.8/13.0 spconv/cumm wheels (incl. Blackwell sm_120)"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Toolchain comes entirely from conda-forge — no system CUDA, no root, no GPU.
# gcc/gxx are pinned to 12: the wheels bundle no libstdc++, so the newest
# GLIBCXX symbol they reference must exist on target systems. gcc 12 needs
# GLIBCXX <= 3.4.30 (Ubuntu 22.04's baseline); gcc 13/14 emit 3.4.31/32
# references and the wheels fail to import on 22.04. build.sh enforces this
# with a readelf gate on every built wheel.
[dependencies]
gcc = "12.*"
gxx = "12.*"
cmake = "*"
ninja = "*"
git = "*"
pip = "*"

# Build-time python deps, pinned to the versions the wheels were verified with.
[pypi-dependencies]
pccm = "==0.4.16"
ccimport = "==0.4.4"
setuptools = "*"
wheel = "*"
numpy = "*"

# CUDA toolkit minor versions match the runtime libs the corresponding torch
# builds ship (the wheels resolve libcudart/libnvrtc sonames from torch's
# bundled NVIDIA libraries at import time).
[feature.cu128.dependencies]
cuda-toolkit = "12.8.*"

# Not the cuda-toolkit metapackage: it drags in cuda-gdb, whose conda-forge
# builds are per-python and missing for some versions, breaking the solve.
# compiler + libraries-dev is everything a build needs, nothing py-specific.
[feature.cu130.dependencies]
cuda-compiler = "13.0.*"
cuda-libraries-dev = "13.0.*"
cuda-cudart-static = "13.0.*"
cuda-cccl = "*"

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[environments]
py310 = ["py310", "cu128"]
py311 = ["py311", "cu128"]
py312 = ["py312", "cu128"]
py313 = ["py313", "cu128"]
py310-cu130 = ["py310", "cu130"]
py311-cu130 = ["py311", "cu130"]
py312-cu130 = ["py312", "cu130"]
py313-cu130 = ["py313", "cu130"]
