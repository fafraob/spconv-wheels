name: build-wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        env: [py310, py311, py312, py313]
    steps:
      - uses: actions/checkout@v4
      # cuda-toolkit + the build need room; runners start ~14GB free
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          environments: ${{ matrix.env }}
      - name: Build wheels
        run: pixi run -e ${{ matrix.env }} bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.env }}
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum *.whl > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS.txt
